# Hand-maintained, static - not touched by peerctl.py.
# BGP community handling per https://dn42.eu/howto/BGP-communities
#
# Adapted from the dn42 wiki's Bird2 example (originally by Jplitza / mk16).
# One fix vs. the wiki text: update_topology() now tags with `link_topology`
# instead of re-tagging with the function reference itself (copy-paste bug
# in the published example).
#
# Include this BEFORE your peers, and AFTER the DN_REGION_GEO / DN_REGION_COUNTRY
# defines and the is_valid_network()/is_self_net()/roa_check() plumbing in
# bird-main-example.conf:
#
#   include "/etc/bird/community_filters.conf";
#   include "/etc/bird/peers/*";

function update_latency(int link_latency) -> int {
  bgp_community.add((64511, link_latency));
       if (64511, 9) ~ bgp_community then { bgp_community.delete([(64511, 1..8)]); return 9; }
  else if (64511, 8) ~ bgp_community then { bgp_community.delete([(64511, 1..7)]); return 8; }
  else if (64511, 7) ~ bgp_community then { bgp_community.delete([(64511, 1..6)]); return 7; }
  else if (64511, 6) ~ bgp_community then { bgp_community.delete([(64511, 1..5)]); return 6; }
  else if (64511, 5) ~ bgp_community then { bgp_community.delete([(64511, 1..4)]); return 5; }
  else if (64511, 4) ~ bgp_community then { bgp_community.delete([(64511, 1..3)]); return 4; }
  else if (64511, 3) ~ bgp_community then { bgp_community.delete([(64511, 1..2)]); return 3; }
  else if (64511, 2) ~ bgp_community then { bgp_community.delete([(64511, 1..1)]); return 2; }
  else return 1;
}

function update_bandwidth(int link_bandwidth) -> int {
  bgp_community.add((64511, link_bandwidth));
       if (64511, 21) ~ bgp_community then { bgp_community.delete([(64511, 22..29)]); return 21; }
  else if (64511, 22) ~ bgp_community then { bgp_community.delete([(64511, 23..29)]); return 22; }
  else if (64511, 23) ~ bgp_community then { bgp_community.delete([(64511, 24..29)]); return 23; }
  else if (64511, 24) ~ bgp_community then { bgp_community.delete([(64511, 25..29)]); return 24; }
  else if (64511, 25) ~ bgp_community then { bgp_community.delete([(64511, 26..29)]); return 25; }
  else if (64511, 26) ~ bgp_community then { bgp_community.delete([(64511, 27..29)]); return 26; }
  else if (64511, 27) ~ bgp_community then { bgp_community.delete([(64511, 28..29)]); return 27; }
  else if (64511, 28) ~ bgp_community then { bgp_community.delete([(64511, 29..29)]); return 28; }
  else return 29;
}

function update_crypto(int link_crypto) -> int {
  bgp_community.add((64511, link_crypto));
       if (64511, 31) ~ bgp_community then { bgp_community.delete([(64511, 32..36)]); return 31; }
  else if (64511, 32) ~ bgp_community then { bgp_community.delete([(64511, 33..36)]); return 32; }
  else if (64511, 33) ~ bgp_community then { bgp_community.delete([(64511, 34..36)]); return 33; }
  else if (64511, 34) ~ bgp_community then { bgp_community.delete([(64511, 35..36)]); return 34; }
  else if (64511, 35) ~ bgp_community then { bgp_community.delete([(64511, 36..36)]); return 35; }
  else return 36;
}

function update_topology(int link_topology) -> int {
  bgp_community.add((64511, link_topology));
       if (64511, 89) ~ bgp_community then { bgp_community.delete([(64511, 81..88)]); return 89; }
  else if (64511, 85) ~ bgp_community then { bgp_community.delete([(64511, 81..84)]); return 85; }
  else if (64511, 84) ~ bgp_community then { bgp_community.delete([(64511, 81..83)]); return 84; }
  else if (64511, 83) ~ bgp_community then { bgp_community.delete([(64511, 81..82)]); return 83; }
  else if (64511, 82) ~ bgp_community then { bgp_community.delete([(64511, 81..81)]); return 82; }
  else return 81;
}

function update_packetloss(int link_packetloss) -> int {
  bgp_community.add((64511, link_packetloss));
       if (64511, 94) ~ bgp_community then { bgp_community.delete([(64511, 91..93)]); return 94; }
  else if (64511, 93) ~ bgp_community then { bgp_community.delete([(64511, 91..92)]); return 93; }
  else if (64511, 92) ~ bgp_community then { bgp_community.delete([(64511, 91..91)]); return 92; }
  else return 91;
}

# Tags routes you originate (not transited routes) with your region/country.
# Remove this function (and its call in dn42_export_filter) if you don't
# want to advertise your region/country.
function update_geo_flags() {
  if (is_self_net() || is_self_net_v6()) && source = RTS_STATIC then {
    bgp_community.add((64511, DN_REGION_GEO));
    bgp_community.add((64511, DN_REGION_COUNTRY));
  }
}

function update_flags(int link_latency; int link_bandwidth; int link_crypto; int link_topology; int link_packetloss) -> bool
int dn42_latency;
int dn42_bandwidth;
int dn42_crypto;
int dn42_topology;
int dn42_packetloss;
{
  dn42_latency = update_latency(link_latency);
  dn42_bandwidth = update_bandwidth(link_bandwidth) - 20;
  dn42_crypto = update_crypto(link_crypto) - 30;
  dn42_topology = update_topology(link_topology) - 80;
  dn42_packetloss = update_packetloss(link_packetloss) - 90;

  return true;
}

# Uses ROA (dn42_roa / dn42_roa_v6 tables, defined in bird-main-example.conf),
# so this must be included after those tables are declared.

function dn42_import_filter(int link_latency; int link_bandwidth; int link_crypto; int link_topology; int link_packetloss) {
  # IPv4 routes with ROA
  if is_valid_network() && !is_self_net() then {
    if (roa_check(dn42_roa, net, bgp_path.last) != ROA_VALID) then {
      print "[dn42] IPv4 ROA check failed for ", net, " ASN ", bgp_path.last;
      reject;
    }

    update_flags(link_latency, link_bandwidth, link_crypto, link_topology, link_packetloss);

    if (bgp_path.len = 1) then
      bgp_local_pref = bgp_local_pref + 500;

    accept;
  }

  # IPv6 routes with ROA
  if is_valid_network_v6() && !is_self_net_v6() then {
    if (roa_check(dn42_roa_v6, net, bgp_path.last) != ROA_VALID) then {
      print "[dn42] IPv6 ROA check failed for ", net, " ASN ", bgp_path.last;
      reject;
    }

    update_flags(link_latency, link_bandwidth, link_crypto, link_topology, link_packetloss);

    if (bgp_path.len = 1) then
      bgp_local_pref = bgp_local_pref + 500;

    accept;
  }

  reject;
}

function dn42_export_filter(int link_latency; int link_bandwidth; int link_crypto; int link_topology; int link_packetloss) {
  if is_valid_network() || is_valid_network_v6() then {
    update_flags(link_latency, link_bandwidth, link_crypto, link_topology, link_packetloss);
    update_geo_flags();

    # Administrative routing policy via MED: prefer lower latency, higher
    # bandwidth, stronger crypto on routes we advertise to this peer. Uses
    # the raw link_* parameters directly (not the classified 64511,x value),
    # matching the dn42 wiki's example.
    bgp_med = 0;
    bgp_med = bgp_med + ( ( 4 - ( link_crypto - 30 ) ) * 600 );
    bgp_med = bgp_med + ( ( 9 - ( link_bandwidth - 20 ) ) * 100 );
    bgp_med = bgp_med + ( ( link_latency - 1 ) * 300 );

    accept;
  }
  reject;
}
