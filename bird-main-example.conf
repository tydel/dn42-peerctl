# Example top-level /etc/bird/bird.conf.
# peerctl.py only ever writes into /etc/bird/peers/*.conf - everything in
# this file (variable header, filters, ROA, kernel/device protocols, static
# routes) is yours to maintain by hand. Fill in the placeholders below from
# your peers.yaml / dn42 registry objects.

################################################
#               Variable header               #
################################################

define OWNAS    = 4242421234;          # = peers.yaml: my_asn
define OWNIP    = 172.22.1.1;          # = peers.yaml: loopback.ipv4 (no /mask)
define OWNIPv6  = fd00:1234:5678::1;   # = peers.yaml: loopback.ipv6 (no /mask)
define OWNNET   = 172.22.1.0/28;       # = peers.yaml: own_networks.ipv4[0]
define OWNNETv6 = fd00:1234:5678::/48; # = peers.yaml: own_networks.ipv6[0]
define OWNNETSET   = [172.22.1.0/28+];
define OWNNETSETv6 = [fd00:1234:5678::/48+];

# Used by community_filters.conf's update_geo_flags() - see
# https://dn42.eu/howto/BGP-communities#route-origin
# = peers.yaml: region / country
define DN_REGION_GEO     = 41;    # 41 = Europe
define DN_REGION_COUNTRY = 1276;  # 1276 = Germany

################################################
#                 Header end                  #
################################################

router id OWNIP;

protocol device {
    scan time 10;
}

/*
 * Utility functions - required by community_filters.conf and the dnpeers
 * template below.
 */

function is_self_net() -> bool {
  return net ~ OWNNETSET;
}

function is_self_net_v6() -> bool {
  return net ~ OWNNETSETv6;
}

function is_valid_network() -> bool {
  return net ~ [
    172.20.0.0/14{21,29}, # dn42
    172.20.0.0/24{28,32}, # dn42 Anycast
    172.21.0.0/24{28,32}, # dn42 Anycast
    172.22.0.0/24{28,32}, # dn42 Anycast
    172.23.0.0/24{28,32}, # dn42 Anycast
    172.31.0.0/16+,       # ChaosVPN
    10.100.0.0/14+,       # ChaosVPN
    10.127.0.0/16+,       # neonetwork
    10.0.0.0/8{15,24}     # Freifunk.net
  ];
}

function is_valid_network_v6() -> bool {
  return net ~ [
    fd00::/8{44,64} # ULA address space as per RFC 4193
  ];
}

/*
 * ROA tables - required before community_filters.conf's dn42_import_filter,
 * which rejects anything that doesn't ROA-validate. Kept current by
 * dn42-roa.timer (see peerctl.py bootstrap / README).
 */

roa4 table dn42_roa;
roa6 table dn42_roa_v6;

protocol static {
    roa4 { table dn42_roa; };
    include "/etc/bird/roa_dn42.conf";
};

protocol static {
    roa6 { table dn42_roa_v6; };
    include "/etc/bird/roa_dn42_v6.conf";
};

protocol kernel {
    scan time 20;
    ipv4 {
        import none;
        export filter {
            if source = RTS_STATIC then reject;
            krt_prefsrc = OWNIP;
            accept;
        };
    };
}

protocol kernel {
    scan time 20;
    ipv6 {
        import none;
        export filter {
            if source = RTS_STATIC then reject;
            krt_prefsrc = OWNIPv6;
            accept;
        };
    };
};

# One "route ... reject;" static block per registered prefix in
# peers.yaml: own_networks. This is what makes BIRD originate/export your
# own space (source = RTS_STATIC) rather than only relaying learned routes.
protocol static {
    route OWNNET reject;
    ipv4 {
        import all;
        export none;
    };
}

protocol static {
    route OWNNETv6 reject;
    ipv6 {
        import all;
        export none;
    };
}

protocol direct {
    interface "dn42", "wg-*";
    ipv4;
    ipv6;
}

# Base template peers inherit from. Peer-level "import where"/"export where"
# (written by peerctl.py, see /etc/bird/peers/*.conf) call
# dn42_import_filter()/dn42_export_filter() from community_filters.conf,
# which do the ROA check + BGP community tagging together - they replace
# the plain filters below when a peer specifies community values.
template bgp dnpeers {
    local as OWNAS;
    path metric on;

    ipv4 {
        import filter {
            if is_valid_network() && !is_self_net() then {
                if (roa_check(dn42_roa, net, bgp_path.last) != ROA_VALID) then {
                    print "[dn42] ROA check failed for ", net, " ASN ", bgp_path.last;
                    reject;
                } else accept;
            } else reject;
        };
        export filter { if is_valid_network() && source ~ [RTS_STATIC, RTS_BGP] then accept; else reject; };
        import limit 9000 action block;
    };

    ipv6 {
        import filter {
            if is_valid_network_v6() && !is_self_net_v6() then {
                if (roa_check(dn42_roa_v6, net, bgp_path.last) != ROA_VALID) then {
                    print "[dn42] ROA check failed for ", net, " ASN ", bgp_path.last;
                    reject;
                } else accept;
            } else reject;
        };
        export filter { if is_valid_network_v6() && source ~ [RTS_STATIC, RTS_BGP] then accept; else reject; };
        import limit 9000 action block;
    };
}

# Community-aware filter helpers (latency/bandwidth/crypto/topology/
# packetloss + region/country origin tagging). Must come after the
# definitions/tables above, before the peers that use it.
include "/etc/bird/community_filters.conf";

# Generated by peerctl.py from /etc/dn42/peers.yaml - never hand-edit.
include "/etc/bird/peers/*.conf";
